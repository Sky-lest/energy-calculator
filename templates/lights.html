<!doctype html>

<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >

  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="/static/css/style.css">

  <title>Calculadora de eficiência energética para casas inteligentes</title>

</head>

<body>
  <header class="header">
    <div class="header__text">
      <h1>Calcule a eficiência energética da sua casa!</h1>

      <p>Seja proativo e resolva o problema do consumo excessivo de energia!</p>
    </div>
  </header>

  <main>
    {% block content %}
    <h2 class="main__title">Selecione quantas luminárias existem na sua casa:</h2>

    <ul class="list" id="list">
      <!--2-4 LÂMPADAS-->
      <li class="list__item">
        <a href="{{'/' ~ size ~ '/' ~ '3' }}">

        <img class="item__img" src="/static/img/light.svg" alt="light">

        <span>2-4 lâmpadas</span></a>
      </li>
      
      <!--5-7 LÂMPADAS-->
      <li class="list__item">
        <a href="{{'/' ~ size ~ '/' ~ '6' }}">

        <img class="item__img" src="/static/img/light.svg" alt="light">

        <span>5-7 lâmpadas</span></a>
      </li>

      <!--10+ LÂMPADAS-->
      <li class="list__item">
        <a href="{{'/' ~ size ~ '/' ~ '10' }}">

        <img class="item__img" src="/static/img/light.svg" alt="light">

        <span>10+ lâmpadas</span></a>
      </li>

      <!-- ecologia -->
      <li class="list__item">
        <a href="{{'/' ~ size ~ '/' ~ '1' }}">
          
        <img class="item__img" src="/static/img/light_green.svg" alt="light">

        <span>Nossa construção ecológica</span></a>
      </li>

    </ul>
    {% endblock %}
  </main>
</body>

</html>
